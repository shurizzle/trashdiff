[package]
name = "trashdiff"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Weekly waste collection schedule with http/cgi/fcgi/scgi frontends"

[features]
default = ["http", "cgi", "fcgi", "scgi"]
http = ["dep:actix-web"]
cgi = ["dep:cegla-cgi", "dep:tokio"]
fcgi = ["dep:cegla-fcgi", "dep:tokio"]
scgi = ["dep:cegla-scgi", "dep:tokio"]

[dependencies]
actix-web = { version = "4", optional = true }
bitflags = "2.13.1"
bytes = "1"
cegla-cgi = { version = "0.2.3", features = ["server"], optional = true }
cegla-fcgi = { version = "0.2.3", features = ["server"], optional = true }
cegla-scgi = { version = "0.2.3", features = ["server"], optional = true }
chrono = "0.4"
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
form_urlencoded = "1"
http = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-std", "io-util", "net", "macros"], optional = true }
toml = "1.1"

[build-dependencies]
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
oxc_allocator = "0.148"
oxc_codegen = "0.148"
oxc_mangler = "0.148"
oxc_minifier = "0.148"
oxc_parser = "0.148"
oxc_span = "0.148"

[dev-dependencies]
futures-util = "0.3"
tokio-util = "0.7"
