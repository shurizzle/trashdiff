[package]
name = "trashdiff"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Weekly waste collection schedule with http/cgi/fcgi/scgi frontends"

[dependencies]
actix-web = "4"
bytes = "1"
cegla-cgi = { version = "0.2.3", features = ["server"] }
cegla-fcgi = { version = "0.2.3", features = ["server"] }
cegla-scgi = { version = "0.2.3", features = ["server"] }
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
form_urlencoded = "1"
http = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-std", "io-util", "net", "macros"] }
toml = "1.1"

[dev-dependencies]
futures-util = "0.3"
tokio-util = "0.7"
